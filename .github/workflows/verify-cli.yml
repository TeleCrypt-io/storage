name: Verify storage CLI

on:
  push:
    branches: ["main"]
    paths: ["cli/**", "scripts/**", ".github/workflows/verify-cli.yml", ".node-version", "LICENSE"]
  pull_request:
    paths: ["cli/**", "scripts/**", ".github/workflows/verify-cli.yml", ".node-version", "LICENSE"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: cli
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: cli/package-lock.json

      - name: Check the package manager
        run: test "$(npm --version)" = "$(node -p 'require("./package.json").packageManager.replace(/^npm@/u, "")')"

      - name: Install exact dependencies
        run: npm ci --ignore-scripts --no-fund --no-audit

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build
