name: Deploy prepared Pages release

# Dispatch with --ref <annotated release tag>, only after owner-authorized promotion.
on:
  workflow_dispatch:

permissions: {contents: read}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions: {contents: read, pages: write, id-token: write}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      RELEASE_SHA: ${{ github.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
        with: {fetch-depth: 0, persist-credentials: false}
      - name: Download the immutable release and verify its source and archive
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/download-release.sh "$RELEASE_TAG" "$RELEASE_SHA" "$RUNNER_TEMP/release"
          mkdir dist
          unzip "$RUNNER_TEMP/release/storage-web-${RELEASE_TAG#storage-web-v}.pages.zip" -d dist
      - uses: actions/configure-pages@v6.0.0
      - uses: actions/upload-pages-artifact@v5.0.0
        with: {path: dist}
      - id: deployment
        uses: actions/deploy-pages@v5.0.1
        with: {artifact_name: github-pages}
