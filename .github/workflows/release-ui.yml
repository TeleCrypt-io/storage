name: Deploy Storage Web

on:
  push:
    branches: [stage]
  workflow_dispatch:
    inputs:
      environment:
        description: Destination environment
        type: choice
        required: true
        default: stage
        options: [stage, production]
      release_tag:
        description: Annotated storage-web release tag (required for Production)
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: storage-${{ github.event_name == 'push' && 'stage' || inputs.environment || 'stage' }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      DEPLOY_ENV: ${{ github.event_name == 'push' && 'stage' || inputs.environment || 'stage' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: selection
        name: Pin the requested application source
        shell: bash
        env:
          RELEASE_TAG_INPUT: ${{ inputs.release_tag }}
        run: >-
          bash scripts/select-storage-release.sh
          "$GITHUB_EVENT_NAME" "$GITHUB_REF" "$GITHUB_SHA"
          "$DEPLOY_ENV" "$RELEASE_TAG_INPUT" >>"$GITHUB_OUTPUT"

      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ steps.selection.outputs.source_ref }}
          path: source
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: source/.node-version
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Pin npm to the selected source version
        shell: bash
        run: |
          set -euo pipefail
          npm_version="$(node -p 'require("./source/package.json").packageManager.replace(/^npm@/u, "")')"
          npm install --global "npm@$npm_version"
          test "$(npm --version)" = "$npm_version"

      - if: steps.selection.outputs.source_kind == 'branch'
        name: Validate selected branch with its locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd source
          test "$(node --version)" = "v$(cat .node-version)"
          npm ci --ignore-scripts --no-fund --no-audit
          npm run lint
          npm test
          rm -rf -- dist
          npm run build
          bash scripts/test-release-scripts.sh
          bash scripts/test-storage-deployment.sh

      - name: Render and publish the selected application
        shell: bash
        env:
          UPCLOUD_ACCESS_KEY_ID: ${{ env.DEPLOY_ENV == 'stage' && secrets.UPCLOUD_STAGE_ACCESS_KEY_ID || secrets.UPCLOUD_PRODUCTION_ACCESS_KEY_ID }}
          UPCLOUD_SECRET_ACCESS_KEY: ${{ env.DEPLOY_ENV == 'stage' && secrets.UPCLOUD_STAGE_SECRET_ACCESS_KEY || secrets.UPCLOUD_PRODUCTION_SECRET_ACCESS_KEY }}
          SOURCE_SHA: ${{ steps.selection.outputs.source_sha }}
          SOURCE_METADATA_REF: ${{ steps.selection.outputs.metadata_source_ref }}
          SOURCE_KIND: ${{ steps.selection.outputs.source_kind }}
          RELEASE_TAG: ${{ steps.selection.outputs.tag }}
        run: |
          set -euo pipefail
          export AWS_ACCESS_KEY_ID="$UPCLOUD_ACCESS_KEY_ID"
          export AWS_SECRET_ACCESS_KEY="$UPCLOUD_SECRET_ACCESS_KEY"
          export AWS_DEFAULT_REGION=europe-2
          export AWS_EC2_METADATA_DISABLED=true
          export AWS_CONFIG_FILE="$RUNNER_TEMP/upcloud-aws-config"
          cat >"$AWS_CONFIG_FILE" <<'EOF'
          [default]
          region = europe-2
          request_checksum_calculation = when_required
          response_checksum_validation = when_required
          s3 =
            addressing_style = path
            signature_version = s3v4
          EOF
          bash scripts/publish-storage-release.sh \
            "$DEPLOY_ENV" "$SOURCE_KIND" "$RELEASE_TAG" "$SOURCE_SHA" \
            "$SOURCE_METADATA_REF" source
