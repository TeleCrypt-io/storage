name: Verify storage site

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .node-version
          cache: "npm"

      - name: Install exact dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm_version="$(node -p 'require("./package.json").packageManager.replace(/^npm@/u, "")')"
          test "$(npm --version)" = "$npm_version"
          npm ci --ignore-scripts --no-fund --no-audit

      - name: Lint
        shell: bash
        run: |
          set -euo pipefail
          npm run lint

      - name: Unit tests
        shell: bash
        run: |
          set -euo pipefail
          npm test

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          npm run build
